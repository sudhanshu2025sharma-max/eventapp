<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Server Error — ETD 2026</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(135deg, #0F172A 0%, #1e293b 100%);
    color: #fff;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 20px;
    padding: 48px 40px;
    max-width: 480px;
    text-align: center;
    backdrop-filter: blur(12px);
  }
  .code {
    font-size: 96px;
    font-weight: 900;
    background: linear-gradient(135deg, #ef4444, #dc2626);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    line-height: 1;
    margin-bottom: 8px;
  }
  h1 { font-size: 24px; font-weight: 800; margin-bottom: 12px; }
  p { font-size: 15px; color: rgba(255,255,255,0.6); line-height: 1.6; margin-bottom: 28px; }
  a.btn {
    display: inline-block;
    background: linear-gradient(135deg, #0333b6, #0245c7);
    color: #fff;
    text-decoration: none;
    padding: 14px 32px;
    border-radius: 12px;
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.3px;
    transition: transform 0.15s;
  }
  a.btn:hover { transform: translateY(-2px); }
  .footer { margin-top: 32px; font-size: 12px; color: rgba(255,255,255,0.3); }
</style>
</head>
<body>
  <div class="card">
    <div class="code">500</div>
    <h1>Something Went Wrong</h1>
    <p>An unexpected error occurred on our end. The technical team has been automatically notified. Please try again in a moment.</p>
    <a href="/panel/" class="btn">Go to Dashboard</a>
    <div class="footer">ETD 2026 &middot; IIT Delhi &middot; ETDs in the age of AI</div>
  </div>
</body>
</html>
