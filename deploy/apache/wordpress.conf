<VirtualHost *:80>
    ServerName etd2026.iitd.ac.in
    ServerAlias www.etd2026.iitd.ac.in

    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/wordpress_error.log
    CustomLog ${APACHE_LOG_DIR}/wordpress_access.log combined

    ProxyPreserveHost On
    ProxyTimeout 120
    LimitRequestBody 52428800

    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    # Production web app; TLS terminates at the IITD gateway.
    RedirectMatch 301 ^/app$ https://etd2026.iitd.ac.in/app/
    ProxyPass /app/ !
    Alias /app/ /var/www/etd2026-app/

    <Directory /var/www/etd2026-app>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.html
        FallbackResource /app/index.html
    </Directory>

    # Return 404 for missing assets instead of serving HTML as JavaScript.
    <Directory /var/www/etd2026-app/_expo>
        FallbackResource disabled
    </Directory>
    <Directory /var/www/etd2026-app/assets>
        FallbackResource disabled
    </Directory>

    AddType application/manifest+json .webmanifest
    <LocationMatch "^/app/(index\.html|manifest\.webmanifest|service-worker\.js)?$">
        Header always set Cache-Control "no-cache"
    </LocationMatch>
    <Location "/app/service-worker.js">
        Header always set Service-Worker-Allowed "/app/"
    </Location>

    RewriteEngine On
    # Alias maps the web app outside the WordPress directory.
    RewriteRule ^/app(?:/|$) - [L]

    # Existing native Expo development manifest routing at /.
    RewriteCond %{HTTP:expo-platform} !^$ [OR]
    RewriteCond %{HTTP:expo-api-version} !^$ [OR]
    RewriteCond %{HTTP_USER_AGENT} Expo [OR]
    RewriteCond %{HTTP_USER_AGENT} okhttp
    RewriteRule ^/$ http://10.17.9.48:8081/ [P,L]

    ProxyPass /ws/ ws://10.17.9.48:8000/ws/
    ProxyPassReverse /ws/ ws://10.17.9.48:8000/ws/

    ProxyPass /api/ http://10.17.9.48:8000/api/
    ProxyPassReverse /api/ http://10.17.9.48:8000/api/

    ProxyPass /panel/ http://10.17.9.48:8000/panel/
    ProxyPassReverse /panel/ http://10.17.9.48:8000/panel/

    ProxyPass /media/ http://10.17.9.48:8000/media/
    ProxyPassReverse /media/ http://10.17.9.48:8000/media/

    ProxyPass /static/panel/ http://10.17.9.48:8000/static/panel/
    ProxyPassReverse /static/panel/ http://10.17.9.48:8000/static/panel/

    # Existing Metro development routes.
    ProxyPass /hot ws://10.17.9.48:8081/hot
    ProxyPassReverse /hot ws://10.17.9.48:8081/hot

    ProxyPass /message ws://10.17.9.48:8081/message
    ProxyPassReverse /message ws://10.17.9.48:8081/message

    ProxyPass /_expo/ http://10.17.9.48:8081/_expo/
    ProxyPassReverse /_expo/ http://10.17.9.48:8081/_expo/

    ProxyPass /index.bundle http://10.17.9.48:8081/index.bundle
    ProxyPassReverse /index.bundle http://10.17.9.48:8081/index.bundle

    ProxyPass /status http://10.17.9.48:8081/status
    ProxyPassReverse /status http://10.17.9.48:8081/status

    ProxyPass /assets/ http://10.17.9.48:8081/assets/
    ProxyPassReverse /assets/ http://10.17.9.48:8081/assets/
</VirtualHost>
