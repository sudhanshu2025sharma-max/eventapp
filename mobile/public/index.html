<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <meta name="theme-color" content="#0F172A" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="ETD 2026" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/app/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/app/pwa-icon.png" />
    <link rel="preload" as="image" href="/app/splash-background.png" />
    <style id="expo-reset">
      html, body { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; overscroll-behavior: none; background: #f0f4f9; }
      body { position: fixed; inset: 0; touch-action: pan-x pan-y; }
      #root { position: absolute; inset: 0; display: flex; width: 100%; height: 100%; height: 100dvh; min-width: 0; min-height: 0; overflow: hidden; }
      #root * { overscroll-behavior: contain; }
      input, textarea, select { font-size: 16px !important; }
      input, textarea { -webkit-text-size-adjust: 100%; }
    </style>
  </head>
  <body>
    <noscript>Enable JavaScript to use the ETD 2026 conference app.</noscript>
    <div id="root"></div>
    <script>
      // Safari may ignore viewport zoom limits; block page gestures, not component scrolling.
      document.addEventListener('gesturestart', function (event) { event.preventDefault(); }, { passive: false });
      document.addEventListener('gesturechange', function (event) { event.preventDefault(); }, { passive: false });
      document.addEventListener('wheel', function (event) { if (event.ctrlKey) event.preventDefault(); }, { passive: false });
    </script>
  </body>
</html>
